[package]
name = "deres-signal"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The analog-signal step of b0r3d DeRes: a small WebAssembly wrapper around the ntsc-rs engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine crate only (crates/ntscrs, MIT OR ISC OR Apache-2.0), pinned to one commit.
# No threads: the browser build runs in DeRes's image worker.
ntsc-rs = { git = "https://github.com/valadaptive/ntsc-rs", rev = "450c6ee48bbb0c440db07973bd357df2982e89e4", default-features = false, features = ["std"] }
# Must match the wasm-bindgen CLI that builds it (scripts/build-signal.mjs checks).
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
